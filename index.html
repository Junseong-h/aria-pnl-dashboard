<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>아리아 식음료 P&L 대시보드</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/core@1.4.0/dist/css/tabler.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.34.1/dist/tabler-icons.min.css">
  <style>
    :root {
      --dash-ink: #17212f;
      --dash-muted: #667085;
      --dash-line: #dbe3ee;
      --dash-blue: #2563eb;
      --dash-teal: #008878;
      --dash-amber: #b7791f;
      --dash-red: #c2410c;
      --dash-panel: #ffffff;
      --dash-bg: #f4f7fb;
    }

    body {
      background: var(--dash-bg);
      color: var(--dash-ink);
      letter-spacing: 0;
    }

    .page-wrapper {
      min-height: 100vh;
    }

    .navbar-brand {
      font-weight: 700;
      letter-spacing: 0;
    }

    .dashboard-shell {
      max-width: 1480px;
      margin: 0 auto;
      padding: 18px;
    }

    .control-band,
    .metric-card,
    .chart-panel,
    .table-panel {
      background: var(--dash-panel);
      border: 1px solid var(--dash-line);
      border-radius: 8px;
      box-shadow: 0 8px 22px rgba(24, 36, 58, 0.05);
    }

    .control-band {
      padding: 16px;
    }

    .metric-card {
      min-height: 118px;
      padding: 16px;
    }

    .metric-label {
      color: var(--dash-muted);
      font-size: 13px;
      font-weight: 650;
    }

    .metric-value {
      font-size: clamp(20px, 2.2vw, 31px);
      line-height: 1.18;
      font-weight: 800;
      white-space: nowrap;
    }

    .metric-foot {
      color: var(--dash-muted);
      font-size: 12px;
      min-height: 18px;
    }

    .chart-panel {
      padding: 14px;
    }

    .chart-title {
      font-size: 15px;
      font-weight: 750;
      margin-bottom: 4px;
    }

    .chart-subtitle {
      min-height: 18px;
      color: var(--dash-muted);
      font-size: 12px;
      margin-bottom: 8px;
    }

    .chart {
      width: 100%;
      height: 360px;
    }

    .chart.chart-sm {
      height: 318px;
    }

    .table-panel {
      padding: 0;
      overflow: hidden;
    }

    .table-scroll {
      overflow: auto;
      max-height: 520px;
    }

    .table thead th {
      position: sticky;
      top: 0;
      z-index: 2;
      background: #eef3f8;
      color: #334155;
      font-size: 12px;
      white-space: nowrap;
    }

    .table td {
      white-space: nowrap;
      vertical-align: middle;
    }

    .btn-check:checked + .btn {
      background: #1f2937;
      border-color: #1f2937;
      color: #fff;
    }

    .form-select,
    .form-control,
    .btn {
      border-radius: 6px;
    }

    .section-title {
      font-size: 17px;
      font-weight: 800;
      margin: 0;
    }

    .period-pill {
      border: 1px solid var(--dash-line);
      border-radius: 999px;
      padding: 6px 11px;
      background: #f8fafc;
      color: #475569;
      font-size: 12px;
      font-weight: 650;
    }

    .empty-state {
      min-height: 180px;
      display: grid;
      place-items: center;
      color: var(--dash-muted);
      text-align: center;
    }

    @media (max-width: 991px) {
      .dashboard-shell {
        padding: 12px;
      }

      .chart {
        height: 300px;
      }

      .metric-value {
        white-space: normal;
      }
    }
  </style>
</head>
<body>
  <div class="page" id="dashboard-root">
    <header class="navbar navbar-expand-md d-print-none bg-white border-bottom">
      <div class="container-xl">
        <div class="navbar-brand">
          <i class="ti ti-chart-histogram me-2 text-blue"></i>
          아리아 식음료 P&L
        </div>
        <div class="navbar-nav flex-row order-md-last">
          <span class="period-pill" id="activePeriod">기간 선택 중</span>
        </div>
      </div>
    </header>

    <div class="page-wrapper">
      <main class="dashboard-shell">
        <section class="control-band mb-3">
          <div class="row g-3 align-items-end">
            <div class="col-12 col-lg-3">
              <label class="form-label">연도</label>
              <div class="btn-group w-100" role="group" aria-label="연도 선택">
                <input type="checkbox" class="btn-check" id="year2025" value="2025" checked>
                <label class="btn" for="year2025">2025</label>
                <input type="checkbox" class="btn-check" id="year2026" value="2026" checked>
                <label class="btn" for="year2026">2026</label>
              </div>
            </div>
            <div class="col-6 col-md-3 col-lg-2">
              <label class="form-label">시작월</label>
              <select class="form-select" id="startMonth"></select>
            </div>
            <div class="col-6 col-md-3 col-lg-2">
              <label class="form-label">종료월</label>
              <select class="form-select" id="endMonth"></select>
            </div>
            <div class="col-12 col-md-6 col-lg-3">
              <label class="form-label">분기</label>
              <div class="btn-group w-100" role="group" aria-label="분기 선택">
                <input type="checkbox" class="btn-check quarter-filter" id="q1" value="Q1" checked>
                <label class="btn" for="q1">Q1</label>
                <input type="checkbox" class="btn-check quarter-filter" id="q2" value="Q2" checked>
                <label class="btn" for="q2">Q2</label>
                <input type="checkbox" class="btn-check quarter-filter" id="q3" value="Q3" checked>
                <label class="btn" for="q3">Q3</label>
                <input type="checkbox" class="btn-check quarter-filter" id="q4" value="Q4" checked>
                <label class="btn" for="q4">Q4</label>

            </div>
            <div class="col-12 col-lg-2">

            <div class="metric-card">

            </div>
          </div>
          <div class="col-12 col-sm-6 col-xl-3">
            <div class="metric-card">

              <div class="metric-value text-teal" id="kpiBevCost">-</div>
              <div class="metric-foot" id="kpiBevCostFoot">-</div>
            </div>
          </div>
          <div class="col-12 col-sm-6 col-xl-3">
            <div class="metric-card">

              <div class="metric-value text-orange" id="kpiBevRate">-</div>
              <div class="metric-foot">가중 평균 기준</div>
            </div>
          </div>
          <div class="col-12 col-sm-6 col-xl-3">
            <div class="metric-card">
              <div class="metric-label">음료 / 와인 매출 비중</div>
              <div class="metric-value" id="kpiMix">-</div>
              <div class="metric-foot">Bev 매출액 내 구성</div>
            </div>
          </div>
        </section>

        <section class="row g-3 mb-3">
          <div class="col-12 col-xl-8">
            <div class="chart-panel">
              <div class="d-flex align-items-center justify-content-between gap-2">
                <div>
                  <div class="chart-title">월별 추이</div>
                  <div class="chart-subtitle" id="trendSubtitle">선택 지표 기준</div>
                </div>
                <span class="badge bg-blue-lt" id="recordCount">0개월</span>
              </div>
              <div class="chart" id="trendChart"></div>
            </div>
          </div>
          <div class="col-12 col-xl-4">
            <div class="chart-panel">
              <div class="chart-title">Bev 구성</div>
              <div class="chart-subtitle">음료와 와인 매출 기여도</div>
              <div class="chart chart-sm" id="mixChart"></div>
            </div>
          </div>
          <div class="col-12 col-xl-6">
            <div class="chart-panel">
              <div class="chart-title">매출액 vs 재료비</div>
              <div class="chart-subtitle">선택 기간 월별 Bev 금액</div>
              <div class="chart chart-sm" id="barChart"></div>
            </div>
          </div>
          <div class="col-12 col-xl-6">
            <div class="chart-panel">
              <div class="chart-title">코스트율 비교</div>
              <div class="chart-subtitle">음료, 와인, Bev 가중 코스트율</div>
              <div class="chart chart-sm" id="rateChart"></div>
            </div>
          </div>
        </section>

        <section class="table-panel">
          <div class="d-flex flex-wrap align-items-center justify-content-between gap-2 p-3 border-bottom">
            <h2 class="section-title">선택 기간 데이터</h2>
            <div class="text-secondary small" id="tableSummary">-</div>
          </div>
          <div class="table-scroll">
            <table class="table table-vcenter table-hover mb-0">
              <thead>
                <tr>
                  <th>연월</th>
                  <th class="text-end">식음료 매출</th>
                  <th class="text-end">음료 매출</th>
                  <th class="text-end">음료 재료비</th>
                  <th class="text-end">음료 코스트율</th>
                  <th class="text-end">와인 매출</th>
                  <th class="text-end">와인 재료비</th>
                  <th class="text-end">와인 코스트율</th>
                  <th class="text-end">Bev 매출</th>
                  <th class="text-end">Bev 재료비</th>
                  <th class="text-end">Bev 코스트율</th>
                </tr>
              </thead>
              <tbody id="detailRows"></tbody>
            </table>
          </div>
        </section>
      </main>
    </div>
  </div>

  <script id="dashboard-core">
    (() => {
      const metricMeta = {
        fnbRevenue: { label: "식음료 매출액", type: "money", color: "#334155" },
        drinkRevenue: { label: "음료 매출액", type: "money", color: "#2563eb" },
        drinkCost: { label: "음료 재료비", type: "money", color: "#60a5fa" },
        drinkCostRate: { label: "음료 코스트율", type: "rate", color: "#2563eb" },
        wineRevenue: { label: "와인 매출액", type: "money", color: "#8b5cf6" },
        wineCost: { label: "와인 재료비", type: "money", color: "#c084fc" },
        wineCostRate: { label: "와인 코스트율", type: "rate", color: "#7c3aed" },
        bevRevenue: { label: "Bev 매출액", type: "money", color: "#008878" },
        bevCost: { label: "Bev 재료비", type: "money", color: "#f59e0b" },
        bevCostRate: { label: "Bev 코스트율", type: "rate", color: "#c2410c" },
      };

      function asArray(value) {
        return Array.isArray(value) ? value : [];
      }

      function byPeriod(a, b) {
        return a.year - b.year || a.month - b.month;
      }

      function filterRecords(records, filters) {
        const years = asArray(filters.years).map(String);
        const quarters = asArray(filters.quarters);
        const startMonth = Number(filters.startMonth || 1);
        const endMonth = Number(filters.endMonth || 12);
        return records
          .filter((row) => years.length === 0 || years.includes(String(row.year)))
          .filter((row) => row.month >= startMonth && row.month <= endMonth)
          .filter((row) => quarters.length === 0 || quarters.includes(row.quarter))
          .sort(byPeriod);
      }

      function sum(records, key) {
        return records.reduce((total, row) => total + (Number(row[key]) || 0), 0);
      }

      function safeRate(cost, revenue) {
        return revenue ? cost / revenue : 0;
      }

      function summarize(records) {
        const drinkRevenue = sum(records, "drinkRevenue");
        const drinkCost = sum(records, "drinkCost");
        const wineRevenue = sum(records, "wineRevenue");
        const wineCost = sum(records, "wineCost");
        const bevRevenue = drinkRevenue + wineRevenue;
        const bevCost = drinkCost + wineCost;
        const fnbRevenue = sum(records, "fnbRevenue");
        return {
          count: records.length,
          fnbRevenue,
          drinkRevenue,
          drinkCost,
          drinkCostRate: safeRate(drinkCost, drinkRevenue),
          wineRevenue,
          wineCost,
          wineCostRate: safeRate(wineCost, wineRevenue),
          bevRevenue,
          bevCost,
          bevCostRate: safeRate(bevCost, bevRevenue),
          bevShareOfFnb: safeRate(bevRevenue, fnbRevenue),
          drinkShareOfBev: safeRate(drinkRevenue, bevRevenue),
          wineShareOfBev: safeRate(wineRevenue, bevRevenue),
        };
      }

      function groupByQuarter(records) {
        const groups = new Map();
        for (const row of records) {
          const key = `${row.year} ${row.quarter}`;
          if (!groups.has(key)) groups.set(key, []);
          groups.get(key).push(row);
        }
        return Array.from(groups, ([label, rows]) => ({ label, ...summarize(rows) }));
      }

      function formatMoney(value) {
        const number = Number(value) || 0;
        if (Math.abs(number) >= 100000000) return `${(number / 100000000).toFixed(1)}억`;
        if (Math.abs(number) >= 10000) return `${Math.round(number / 10000).toLocaleString("ko-KR")}만`;
        return number.toLocaleString("ko-KR");
      }

      function formatRate(value) {
        return `${((Number(value) || 0) * 100).toFixed(1)}%`;
      }

      function formatMetric(value, key) {
        return metricMeta[key]?.type === "rate" ? formatRate(value) : formatMoney(value);
      }

      function monthLabel(row) {
        return `${String(row.year).slice(2)}년 ${row.month}월`;
      }

      function getData() {
        const dataNode = document.getElementById("pnl-data");
        return dataNode ? JSON.parse(dataNode.textContent) : [];
      }

      function selectedValues(selector) {
        return Array.from(document.querySelectorAll(selector))
          .filter((node) => node.checked)
          .map((node) => node.value);
      }

      function getFilters() {
        return {
          years: selectedValues(".btn-check[id^='year']"),
          quarters: selectedValues(".quarter-filter"),
          startMonth: Number(document.getElementById("startMonth").value),
          endMonth: Number(document.getElementById("endMonth").value),
        };
      }

      function setText(id, value) {
        const node = document.getElementById(id);
        if (node) node.textContent = value;
      }

      function initMonthSelects() {
        const start = document.getElementById("startMonth");
        const end = document.getElementById("endMonth");
        if (!start || !end) return;
        for (let month = 1; month <= 12; month += 1) {
          start.add(new Option(`${month}월`, String(month), month === 1, month === 1));
          end.add(new Option(`${month}월`, String(month), month === 12, month === 12));
        }
      }

      function buildBaseChart(titleHidden = false) {
        return {
          animationDuration: 350,
          tooltip: { trigger: "axis", confine: true },
          grid: { left: 62, right: 28, top: titleHidden ? 26 : 38, bottom: 42 },
          legend: { top: 4, itemWidth: 12, itemHeight: 8, textStyle: { color: "#475569" } },
          xAxis: { type: "category", axisLabel: { color: "#64748b" }, axisLine: { lineStyle: { color: "#cbd5e1" } } },
          yAxis: { type: "value", axisLabel: { color: "#64748b" }, splitLine: { lineStyle: { color: "#e2e8f0" } } },
        };
      }

      function renderTrend(chart, records, metricKey) {
        const meta = metricMeta[metricKey];
        chart.setOption({
          ...buildBaseChart(true),
          tooltip: {
            trigger: "axis",
            valueFormatter: (value) => formatMetric(value, metricKey),
          },
          xAxis: { ...buildBaseChart().xAxis, data: records.map(monthLabel) },
          yAxis: {
            ...buildBaseChart().yAxis,
            axisLabel: { formatter: (value) => formatMetric(value, metricKey), color: "#64748b" },
          },
          series: [{
            name: meta.label,
            type: metricKey.includes("Rate") ? "line" : "bar",
            smooth: true,
            data: records.map((row) => row[metricKey]),
            itemStyle: { color: meta.color },
            lineStyle: { width: 3 },
            areaStyle: metricKey.includes("Rate") ? { opacity: 0.08 } : undefined,
          }],
        }, true);
      }

      function renderMix(chart, totals) {
        chart.setOption({
          tooltip: { trigger: "item", valueFormatter: formatMoney },
          legend: { bottom: 0, left: "center" },
          series: [{
            name: "Bev 구성",
            type: "pie",
            radius: ["48%", "72%"],
            center: ["50%", "44%"],
            avoidLabelOverlap: true,
            label: { formatter: "{b}\n{d}%", position: "inside", color: "#fff", fontWeight: 700 },
            data: [
              { name: "음료", value: totals.drinkRevenue, itemStyle: { color: "#2563eb" } },
              { name: "와인", value: totals.wineRevenue, itemStyle: { color: "#8b5cf6" } },
            ],
          }],
        }, true);
      }

      function renderBars(chart, records) {
        chart.setOption({
          ...buildBaseChart(true),
          tooltip: { trigger: "axis", valueFormatter: formatMoney },
          xAxis: { ...buildBaseChart().xAxis, data: records.map(monthLabel) },
          yAxis: { ...buildBaseChart().yAxis, axisLabel: { formatter: formatMoney, color: "#64748b" } },
          series: [
            { name: "Bev 매출", type: "bar", data: records.map((row) => row.bevRevenue), itemStyle: { color: "#008878" } },
            { name: "Bev 재료비", type: "bar", data: records.map((row) => row.bevCost), itemStyle: { color: "#f59e0b" } },
          ],
        }, true);
      }

      function renderRates(chart, records) {
        chart.setOption({
          ...buildBaseChart(true),
          tooltip: { trigger: "axis", valueFormatter: formatRate },
          xAxis: { ...buildBaseChart().xAxis, data: records.map(monthLabel) },
          yAxis: {
            ...buildBaseChart().yAxis,
            axisLabel: { formatter: (value) => `${Math.round(value * 100)}%`, color: "#64748b" },
          },
          series: [
            { name: "음료", type: "line", smooth: true, data: records.map((row) => row.drinkCostRate), itemStyle: { color: "#2563eb" }, lineStyle: { width: 3 } },
            { name: "와인", type: "line", smooth: true, data: records.map((row) => row.wineCostRate), itemStyle: { color: "#8b5cf6" }, lineStyle: { width: 3 } },
            { name: "Bev", type: "line", smooth: true, data: records.map((row) => row.bevCostRate), itemStyle: { color: "#c2410c" }, lineStyle: { width: 3 } },
          ],
        }, true);
      }

      function renderTable(records) {
        const body = document.getElementById("detailRows");
        if (!body) return;
        if (records.length === 0) {
          body.innerHTML = '<tr><td colspan="11"><div class="empty-state">선택한 조건에 데이터가 없습니다.</div></td></tr>';
          return;
        }
        body.innerHTML = records.map((row) => `
          <tr>
            <td><span class="badge bg-secondary-lt">${row.ym}</span></td>
            <td class="text-end">${formatMoney(row.fnbRevenue)}</td>
            <td class="text-end">${formatMoney(row.drinkRevenue)}</td>
            <td class="text-end">${formatMoney(row.drinkCost)}</td>
            <td class="text-end">${formatRate(row.drinkCostRate)}</td>
            <td class="text-end">${formatMoney(row.wineRevenue)}</td>
            <td class="text-end">${formatMoney(row.wineCost)}</td>
            <td class="text-end">${formatRate(row.wineCostRate)}</td>
            <td class="text-end fw-bold">${formatMoney(row.bevRevenue)}</td>
            <td class="text-end">${formatMoney(row.bevCost)}</td>
            <td class="text-end fw-bold">${formatRate(row.bevCostRate)}</td>
          </tr>
        `).join("");
      }

      function updateSummary(records, filters) {
        const totals = summarize(records);
        setText("kpiBevRevenue", formatMoney(totals.bevRevenue));
        setText("kpiBevCost", formatMoney(totals.bevCost));
        setText("kpiBevRate", formatRate(totals.bevCostRate));
        setText("kpiMix", `${formatRate(totals.drinkShareOfBev)} / ${formatRate(totals.wineShareOfBev)}`);
        setText("kpiBevShare", `식음료 매출 대비 ${formatRate(totals.bevShareOfFnb)}`);
        setText("kpiBevCostFoot", `음료 ${formatMoney(totals.drinkCost)} · 와인 ${formatMoney(totals.wineCost)}`);
        setText("recordCount", `${records.length}개월`);
        setText("tableSummary", `분기 ${filters.quarters.join(", ") || "없음"} · ${records.length}개 월`);
        const first = records[0];
        const last = records[records.length - 1];
        setText("activePeriod", records.length ? `${first.ym} - ${last.ym}` : "선택 데이터 없음");
        return totals;
      }

      function applyPreset(name) {
        const ranges = {
          all: [1, 12, ["Q1", "Q2", "Q3", "Q4"]],
          h1: [1, 6, ["Q1", "Q2"]],
          h2: [7, 12, ["Q3", "Q4"]],
          q1: [1, 3, ["Q1"]],
          q2: [4, 6, ["Q2"]],
          q3: [7, 9, ["Q3"]],
          q4: [10, 12, ["Q4"]],
        };
        const [start, end, quarters] = ranges[name] || ranges.all;
        document.getElementById("startMonth").value = String(start);
        document.getElementById("endMonth").value = String(end);
        document.querySelectorAll(".quarter-filter").forEach((node) => {
          node.checked = quarters.includes(node.value);
        });
      }

      function initDashboard() {
        if (!document.getElementById("dashboard-root") || typeof echarts === "undefined") return;
        initMonthSelects();
        const data = getData();
        const charts = {
          trend: echarts.init(document.getElementById("trendChart")),
          mix: echarts.init(document.getElementById("mixChart")),
          bar: echarts.init(document.getElementById("barChart")),
          rate: echarts.init(document.getElementById("rateChart")),
        };

        function refresh() {
          const filters = getFilters();
          if (filters.startMonth > filters.endMonth) {
            const temp = filters.startMonth;
            filters.startMonth = filters.endMonth;
            filters.endMonth = temp;
            document.getElementById("startMonth").value = String(filters.startMonth);
            document.getElementById("endMonth").value = String(filters.endMonth);
          }
          const records = filterRecords(data, filters);
          const totals = updateSummary(records, filters);
          const metricKey = document.getElementById("metricSelect").value;
          setText("trendSubtitle", `${metricMeta[metricKey].label} · 선택 조건 기준`);
          renderTrend(charts.trend, records, metricKey);
          renderMix(charts.mix, totals);
          renderBars(charts.bar, records);
          renderRates(charts.rate, records);
          renderTable(records);
          groupByQuarter(records);
        }

        document.querySelectorAll("input, select").forEach((node) => node.addEventListener("change", refresh));
        document.querySelectorAll("[data-preset]").forEach((node) => {
          node.addEventListener("click", () => {
            applyPreset(node.dataset.preset);
            refresh();
          });
        });
        window.addEventListener("resize", () => Object.values(charts).forEach((chart) => chart.resize()));
        refresh();
      }

      window.DashboardCore = {
        filterRecords,
        summarize,
        groupByQuarter,
        formatMoney,
        formatRate,
        metricMeta,
      };

      if (typeof document !== "undefined" && document.addEventListener) {
        document.addEventListener("DOMContentLoaded", initDashboard);
      }
    })();
  </script>
</body>
</html>
